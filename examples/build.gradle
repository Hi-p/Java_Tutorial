plugins { id 'java' }

repositories { mavenCentral() }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

dependencies {
    // 재현 가능한 학습 예제를 위해 버전 고정 (최신 버전을 의미하지 않음).
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

test {
    useJUnitPlatform {
        if (!project.hasProperty('networkTests')) excludeTags 'network'
    }
    testLogging { events 'passed', 'skipped', 'failed' }
    systemProperty 'file.encoding', 'UTF-8'
}

def demos = [
    runPart10: 'tutorial.part10.CollectionsExample',
    runPart16: 'tutorial.part16.ConcurrencyExample',
    runCancellation: 'tutorial.part16.CancellationExample',
    runPart24: 'tutorial.part24.StockExample',
    runPart32: 'tutorial.part32.EqualityExample',
    runPart33: 'tutorial.part33.ImmutabilityExample',
    runPart34: 'tutorial.part34.DateMoneyExample',
    runPart35: 'tutorial.part35.JsonExample',
    runPart36: 'tutorial.part36.RefactoringExample',
    runHttpServer: 'tutorial.part35.HttpFixtureServer',
    runHttpClient: 'tutorial.part35.HttpJsonExample'
]
demos.each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'tutorial'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = className
        systemProperty 'file.encoding', 'UTF-8'
        if (taskName == 'runHttpClient') {
            args providers.gradleProperty('url').getOrElse('http://127.0.0.1:18080/products/P001')
        }
    }
}
